<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Genuine</title>
<script src="./nk_search.js"></script>
<script src="./webauthn_attestation.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --ok: #1b8a3d;
    --fail: #c62828;
    --test: #d35400;
    --text: #1a1a1a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: color 0.3s ease;
  }

  body.active { color: #fff; }

  header, main { position: relative; z-index: 1; }

  /* Colour layer: bursts outward from the button, collapses back on reset */
  #pop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    clip-path: circle(0 at var(--x, 50%) var(--y, 50%));
    transition: clip-path 0.3s ease-in;
  }
  #pop.on {
    clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%));
    transition: clip-path 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Text pops in with a little overshoot */
  #message.pop-in { animation: textpop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes textpop {
    0%   { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* Top 25% of the screen holds the logo */
  header {
    height: 25%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  header img {
    max-width: min(70%, 320px);
    max-height: 100%;
    background: #fff;
    padding: 0.6rem 1rem;
    border-radius: 12px;
  }

  main {
    width: 100%;
    max-width: 480px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  /* Fixed-height slot so the layout doesn't shift when the button morphs */
  .slot {
    position: relative;
    width: 100%;
    height: 6rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* GPay-style ripple rings radiating from the badge */
  .slot::before,
  .slot::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6rem;
    height: 6rem;
    margin: -3rem 0 0 -3rem;
    border: 3px solid #fff;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  body.active .slot::before { animation: ripple 1s ease-out 0.25s both; }
  body.active .slot::after  { animation: ripple 1s ease-out 0.5s both; }
  @keyframes ripple {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  /* Confetti dots flung outward from the badge (created in JS) */
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    animation: fling 0.9s cubic-bezier(0.1, 0.7, 0.3, 1) 0.3s both;
  }
  @keyframes fling {
    0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
  }

  button {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    width: 100%;
    max-width: 320px;
    height: 3.5rem;
    padding: 0;
    overflow: hidden;
    font: inherit;
    font-size: 1.125rem;
    font-weight: 600;
    color: #fff;
    background: #1a1a1a;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition:
      max-width 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
      height 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
      border-radius 0.5s ease,
      background-color 0.3s ease;
  }

  button:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 4px; }
  button.done:focus-visible { outline-color: #fff; }
  button:disabled { opacity: 0.6; cursor: wait; }

  /* Morphed state: white circle holding the icon */
  button.done {
    max-width: 6rem;
    height: 6rem;
    border-radius: 50%;
    background: #fff;
  }

  .label { grid-area: 1 / 1; white-space: nowrap; transition: opacity 0.15s ease; }
  button.done .label { opacity: 0; }

  .icon {
    grid-area: 1 / 1;
    width: 3.75rem;
    height: 3.75rem;
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.5);
  }
  .icon path { stroke-dasharray: 1; stroke-dashoffset: 1; }

  .i-ok   { stroke: var(--ok); }
  .i-warn { stroke: var(--test); }
  .i-fail { stroke: var(--fail); }

  /* Show the matching icon and draw its strokes in */
  button.verified .i-ok,
  button.test .i-warn,
  button.failed .i-fail {
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.2s ease 0.2s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
  }
  button.verified .i-ok path,
  button.test .i-warn path,
  button.failed .i-fail path {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.4s ease 0.35s;
  }

  #message {
    min-height: 1.5em;
    margin: 0;
    font-size: clamp(2rem, 9vw, 3.5rem);
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: anywhere;
  }

  @media (prefers-reduced-motion: reduce) {
    body, #pop, #pop.on, button, button *, .label { transition: none !important; }
    #message.pop-in { animation: none; }
    .dot, .slot::before, .slot::after { display: none; }
  }
</style>
</head>
<body>
  <div id="pop" aria-hidden="true"></div>
  <header>
    <img src="https://www.nitrokey.com/sites/all/themes/nitrokey/logo.svg" alt="Nitrokey">
  </header>

  <main>
    <div class="slot">
      <button id="verifyBtn" type="button">
        <span class="label">Verify Genuine</span>
        <svg class="icon i-ok" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M13 34 L27 48 L52 17"/>
        </svg>
        <svg class="icon i-warn" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M32 9 L58 54 H6 Z"/>
          <path pathLength="1" d="M32 26 V39"/>
          <path pathLength="1" d="M32 47 V47.5"/>
        </svg>
        <svg class="icon i-fail" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M16 16 L48 48"/>
          <path pathLength="1" d="M48 16 L16 48"/>
        </svg>
      </button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

<script>

  // ---- Replace with your real implementation; must resolve to a string ----
  class NotImplementedError extends Error {}

  async function verify() {
    throw new NotImplementedError("verify() not implemented");
  }

  // ---- UI ----
  const btn = document.getElementById("verifyBtn");
  const msg = document.getElementById("message");
  const pop = document.getElementById("pop");
  const colors = { verified: "var(--ok)", failed: "var(--fail)", test: "var(--test)" };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const slot = btn.parentElement;

  // Confetti dots that burst out from the badge
  function spawnBurst() {
    const n = 14;
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dist = 80 + Math.random() * 60;
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--s", 6 + Math.random() * 6 + "px");
      dot.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      dot.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      slot.appendChild(dot);
    }
  }

  // Collapse back to a white page
  function reset() {
    slot.querySelectorAll(".dot").forEach((d) => d.remove());
    pop.classList.remove("on");
    btn.classList.remove("done", "verified", "failed", "test");
    document.body.classList.remove("active");
    msg.classList.remove("pop-in");
    msg.textContent = "";
  }

  // Burst the colour out from the button's centre, then pop the text in
  function show(state, text) {
    const r = btn.getBoundingClientRect();
    pop.style.setProperty("--x", r.left + r.width / 2 + "px");
    pop.style.setProperty("--y", r.top + r.height / 2 + "px");
    pop.style.background = colors[state];
    document.body.classList.add("active");
    btn.classList.add("done", state);
    spawnBurst();
    void pop.offsetWidth;
    pop.classList.add("on");

    msg.textContent = text;
    msg.classList.remove("pop-in");
    void msg.offsetWidth;
    msg.classList.add("pop-in");
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    reset();
    await sleep(350); // let the page go fully white first

    let result;
    try {
      if (typeof registerAndVerify !== "function") throw new NotImplementedError();
      result = await registerAndVerify();
    } catch (err) {
      console.error(err);
      // Generic text only when verify() is missing/not implemented (or the error has no message)
      const generic = err instanceof NotImplementedError || !err || !err.message;
      show("failed", generic ? "Verification failed or cancelled" : err.message);
      btn.disabled = false;
      return;
    }

    const [status, value] = lookup(result);
    const states = { Verified: "verified", Failed: "failed", Test: "test" };
    show(states[status], value);
    btn.disabled = false;
  });
</script>
</body>
</html>
