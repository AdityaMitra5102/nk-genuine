<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Authenticity | Nitrokey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<script src="./nk_search.js"></script>
<script src="./webauthn_attestation.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --ok: #1b8a3d;
    --fail: #c62828;
    --test: #d35400;
    --text: #000000;
    --brand: #c70336;       /* Nitrokey red */
    --brand-dark: #ab1738;  /* Nitrokey red, hover */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    transition: color 0.3s ease;
  }

  body.active { color: #fff; }

  .site-header, main { position: relative; z-index: 1; }

  /* Header bar, styled after nitrokey.com: white, soft shadow, logo left, links right */
  .site-header {
    width: 100%;
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 2rem;
    padding: 0.75rem 1.5rem;
    background: #fff;
    color: #000;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  }

  .logo { display: block; line-height: 0; }
  .logo img { display: block; height: 58px; width: auto; max-width: 100%; }

  .site-header nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.25rem 1.25rem;
  }

  .site-header nav a {
    display: block;
    padding: 0.6em 0.45em;
    color: #000;
    font-size: 1.0667em;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s ease-in-out;
  }

  .site-header nav a:hover { color: var(--brand-dark); }

  .site-header a:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (max-width: 768px) {
    .site-header { justify-content: center; }
    .site-header nav { justify-content: center; }
  }

  /* Colour layer: bursts outward from the button, collapses back on reset */
  #pop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    clip-path: circle(0 at var(--x, 50%) var(--y, 50%));
    transition: clip-path 0.3s ease-in;
  }
  #pop.on {
    clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%));
    transition: clip-path 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Text pops in with a little overshoot */
  #message.pop-in { animation: textpop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes textpop {
    0%   { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  main {
    width: 100%;
    max-width: 520px;
    padding: 2.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  /* Intro text above the button */
  .intro { text-align: center; font-size: 1.1em; line-height: 1.6; }
  .intro p { margin: 0 0 0.6em; }
  .intro ol {
    display: inline-block;
    margin: 0;
    padding-left: 1.5em;
    text-align: left;
    list-style-position: outside;
  }
  .intro li { margin: 0 0 0.3em; }

  /* Hide instructions once a result is showing */
  body.active .intro { display: none; }

  /* Fixed-height slot so the layout doesn't shift when the button morphs */
  .slot {
    position: relative;
    width: 100%;
    height: 6rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* GPay-style ripple rings radiating from the badge */
  .slot::before,
  .slot::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6rem;
    height: 6rem;
    margin: -3rem 0 0 -3rem;
    border: 3px solid #fff;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  body.active .slot::before { animation: ripple 1s ease-out 0.25s both; }
  body.active .slot::after  { animation: ripple 1s ease-out 0.5s both; }
  @keyframes ripple {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  /* Confetti dots flung outward from the badge (created in JS) */
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    animation: fling 0.9s cubic-bezier(0.1, 0.7, 0.3, 1) 0.3s both;
  }
  @keyframes fling {
    0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
  }

  button {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    place-items: center;
    width: 100%;
    max-width: 320px;
    height: 3.25rem;
    padding: 0;
    overflow: hidden;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: 15px;
    cursor: pointer;
    transition:
      max-width 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
      height 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
      border-radius 0.5s ease,
      background-color 0.5s ease;
  }

  button:not(.done):not(:disabled):hover { background: var(--brand-dark); }

  button:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
  button.done:focus-visible { outline-color: #fff; }
  button:disabled { opacity: 0.6; cursor: wait; }

  /* Morphed state: white circle holding the icon */
  button.done {
    max-width: 6rem;
    height: 6rem;
    border-radius: 50%;
    background: #fff;
  }

  .label { grid-area: 1 / 1; white-space: nowrap; transition: opacity 0.15s ease; }
  button.done .label { opacity: 0; }

  .icon {
    grid-area: 1 / 1;
    width: 3.75rem;
    height: 3.75rem;
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.5);
  }
  .icon path { stroke-dasharray: 1; stroke-dashoffset: 1; }

  .i-ok   { stroke: var(--ok); }
  .i-warn { stroke: var(--test); }
  .i-fail { stroke: var(--fail); }

  /* Show the matching icon and draw its strokes in */
  button.verified .i-ok,
  button.test .i-warn,
  button.failed .i-fail {
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.2s ease 0.2s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
  }
  button.verified .i-ok path,
  button.test .i-warn path,
  button.failed .i-fail path {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.4s ease 0.35s;
  }

  #message {
    min-height: 1.5em;
    margin: 0;
    font-family: 'Teko', 'Open Sans', sans-serif;
    font-size: clamp(2.75rem, 11vw, 4.5rem);
    font-weight: 700;
    line-height: 1.05;
    text-align: center;
    overflow-wrap: anywhere;
  }

  @media (prefers-reduced-motion: reduce) {
    body, #pop, #pop.on, button, button *, .label, .site-header nav a { transition: none !important; }
    #message.pop-in { animation: none; }
    .dot, .slot::before, .slot::after { display: none; }
  }
</style>
</head>
<body>
  <div id="pop" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="https://www.nitrokey.com" target="_blank" rel="noopener" aria-label="Nitrokey website">
      <img src="https://www.nitrokey.com/sites/all/themes/nitrokey/logo.svg" alt="Nitrokey">
    </a>
    <nav aria-label="Nitrokey resources">
      <a href="https://docs.nitrokey.com/nitrokeys/nitrokey3/getting-started" target="_blank" rel="noopener">Getting started with your Nitrokey</a>
      <a href="https://docs.nitrokey.com/nitrokeys/features/fido2/authenticity" target="_blank" rel="noopener">Authenticity</a>
      <a href="https://docs.nitrokey.com/software/nk-app2/" target="_blank" rel="noopener">Nitrokey App 2</a>
    </nav>
  </header>

  <main>
    <div class="intro">
      <p>This page lets you verify the authenticity of your Nitrokey.</p>
      <ol>
        <li>Insert your Nitrokey.</li>
        <li>Click the button to verify authenticity.</li>
      </ol>
    </div>
    <div class="slot">
      <button id="verifyBtn" type="button">
        <span class="label">Verify Authenticity</span>
        <svg class="icon i-ok" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M13 34 L27 48 L52 17"/>
        </svg>
        <svg class="icon i-warn" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M32 9 L58 54 H6 Z"/>
          <path pathLength="1" d="M32 26 V39"/>
          <path pathLength="1" d="M32 47 V47.5"/>
        </svg>
        <svg class="icon i-fail" viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M16 16 L48 48"/>
          <path pathLength="1" d="M48 16 L16 48"/>
        </svg>
      </button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

<script>

  // ---- UI ----
  const btn = document.getElementById("verifyBtn");
  const msg = document.getElementById("message");
  const pop = document.getElementById("pop");
  const colors = { verified: "var(--ok)", failed: "var(--fail)", test: "var(--test)" };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const slot = btn.parentElement;

  // Confetti dots that burst out from the badge
  function spawnBurst() {
    const n = 14;
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dist = 80 + Math.random() * 60;
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--s", 6 + Math.random() * 6 + "px");
      dot.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      dot.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      slot.appendChild(dot);
    }
  }

  // Collapse back to a white page
  function reset() {
    slot.querySelectorAll(".dot").forEach((d) => d.remove());
    pop.classList.remove("on");
    btn.classList.remove("done", "verified", "failed", "test");
    document.body.classList.remove("active");
    msg.classList.remove("pop-in");
    msg.textContent = "";
  }

  // Burst the colour out from the button's centre, then pop the text in
  function show(state, text) {
    const r = btn.getBoundingClientRect();
    pop.style.setProperty("--x", r.left + r.width / 2 + "px");
    pop.style.setProperty("--y", r.top + r.height / 2 + "px");
    pop.style.background = colors[state];
    document.body.classList.add("active");
    btn.classList.add("done", state);
    spawnBurst();
    void pop.offsetWidth;
    pop.classList.add("on");

    msg.textContent = text;
    msg.classList.remove("pop-in");
    void msg.offsetWidth;
    msg.classList.add("pop-in");
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    reset();
    await sleep(350); // let the page go fully white first

    let result;
    try {
      if (typeof registerAndVerify !== "function") throw new Error("Verification function not defined");
      result = await registerAndVerify();
    } catch (err) {
      console.error(err);
      // Generic text only when verify() is missing/not implemented (or the error has no message)
      const generic = !err || !err.message;
      show("failed", generic ? "Verification failed or cancelled" : err.message);
      btn.disabled = false;
      return;
    }

    const [status, value] = lookup(result);
    const states = { Verified: "verified", Failed: "failed", Test: "test" };
    show(states[status], value);
    btn.disabled = false;
  });

//btn.click(); //Uncomment to auto-start verification on page open
  
</script>

</body>
</html>
